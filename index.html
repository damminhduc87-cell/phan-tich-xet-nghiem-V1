<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Remix Phân tích Xét nghiệm Cận lâm sàng 2</title>
    <meta name="description" content="Hệ thống hỗ trợ phân tích kết quả xét nghiệm huyết học, sinh hóa gan, thận, mỡ máu, nước tiểu kết hợp Đông Tây Y chuyên sâu, tích hợp công nghệ AI." />
    <meta property="og:title" content="Remix Phân tích Xét nghiệm Cận lâm sàng 2" />
    <meta property="og:description" content="Hệ thống hỗ trợ phân tích kết quả xét nghiệm huyết học, sinh hóa gan, thận, mỡ máu, nước tiểu kết hợp Đông Tây Y chuyên sâu, tích hợp công nghệ AI." />
    
    <!-- Inline fallback guard for mobile in-app webviews -->
    <script>
      window.addEventListener('error', function(e) {
        var loader = document.getElementById('initial-loader');
        if (loader) {
          loader.innerHTML = '<div style="background:#fff;border-radius:16px;padding:24px;max-width:360px;margin:20px;box-shadow:0 10px 25px rgba(0,0,0,0.1);text-align:center;border:1px solid #fed7aa;">'
            + '<div style="font-size:32px;margin-bottom:8px;">⚠️</div>'
            + '<h3 style="font-size:16px;font-weight:700;color:#9a3412;margin:0 0 8px 0;">Đang mở trên trình duyệt Zalo</h3>'
            + '<p style="font-size:13px;color:#4b5563;line-height:1.5;margin-bottom:16px;">Vui lòng bấm vào dấu <b>(···)</b> ở góc trên bên phải màn hình Zalo và chọn <b>"Mở bằng trình duyệt"</b> (Safari hoặc Chrome) để tải đầy đủ tính năng.</p>'
            + '<button onclick="location.reload()" style="background:#4f46e5;color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;width:100%;">🔄 Thử tải lại</button>'
            + '</div>';
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen min-h-[100dvh] w-full max-w-full overflow-x-hidden">
    <div id="root" class="w-full max-w-full overflow-x-hidden min-h-screen min-h-[100dvh]">
      <!-- Lightweight CSS-only loader replaced automatically when React mounts -->
      <div id="initial-loader" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:20px;box-sizing:border-box;">
        <div style="width:40px;height:40px;border:3.5px solid #e2e8f0;border-top-color:#4f46e5;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px;"></div>
        <div style="font-size:16px;font-weight:700;color:#1e293b;text-align:center;">Đang khởi động hệ thống...</div>
        <div style="font-size:13px;color:#64748b;margin-top:6px;text-align:center;">Phân tích Xét nghiệm Cận lâm sàng & Trợ lý AI</div>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
